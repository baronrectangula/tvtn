# Committed credentials are local defaults; environment variables can override them.
services:
  rest-server:
    profiles: [rest-server]
    build:
      context: .
      args:
        CMD: rest-server
    command: -config config.toml -addr :8080 ${TVTN_REST_ARGS:-}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-tvtn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tvtn_local_password}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tvtn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tvtn_local_password}
      POSTGRES_DB: tvtn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
