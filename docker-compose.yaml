# Local development only. These credentials are intentionally not secrets.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: tvtn
      POSTGRES_PASSWORD: tvtn_local_password
      POSTGRES_DB: tvtn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
